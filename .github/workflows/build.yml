name: Nekonyatsu-ネコポイ

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang curl git wget zip python3

    - name: Set up compiler
      run: |
        git clone --depth=1 https://github.com/ZyCromerZ/clang.git -b 17 ~/clang

    - name: Build kernel
      run: |
        export PATH=~/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out ARCH=arm64 vendor/fog-perf_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang

    - name: Create zip
      run: |
        mkdir -p AnyKernel3
        cd AnyKernel3
        wget https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
        unzip ak3.zip
        mv ../out/arch/arm64/boot/Image.gz-dtb AnyKernel3-master/
        cd AnyKernel3-master
        zip -r9 ../Kernel-Nekonyatsu.zip *

    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Nekonyatsu
        path: AnyKernel3/Kernel-Nekonyatsu.zip
