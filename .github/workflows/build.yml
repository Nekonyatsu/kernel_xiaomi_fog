name: Build Kernel (No KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang curl git wget zip python3 libelf-dev

    - name: Setup Clang (Google AOSP)
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b master clang-aosp
        mkdir -p ~/clang
        cp -r clang-aosp/clang-r*/. ~/clang

    - name: Build kernel
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        export ARCH=arm64
        export KBUILD_BUILD_USER=Nekonyatsu
        export KBUILD_BUILD_HOST=GitHubActions

        make O=out ARCH=arm64 vendor/fog-perf_defconfig
        make -j$(nproc) O=out ARCH=arm64 \
          LLVM=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Pack with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Nekonyatsu-Kernel.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nekonyatsu-Kernel
        path: Nekonyatsu-Kernel.zip
