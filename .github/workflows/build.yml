name: Nekonyatsu-ネコポイ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Kernel Source
    - name: Checkout kernel source
      uses: actions/checkout@v4

    # 2. Install Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang curl git wget zip python3 libelf-dev zstd tar

    # 3. Setup Neutron Clang
    - name: Setup Neutron Clang
      run: |
        curl -L -o neutron-clang.tar.zst https://gitlab.com/clangsantoni/neutron-clang/-/archive/05012024/neutron-clang-05012024.tar.zst
        mkdir -p ~/clang
        tar --use-compress-program=unzstd -xvf neutron-clang.tar.zst -C ~/clang --strip-components=1
        echo "PATH=$HOME/clang/bin:$PATH" >> $GITHUB_ENV

    # 4. Build Kernel
    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="Nekonyatsu"
        export KBUILD_BUILD_HOST="GitHubActions"
        make O=out ARCH=arm64 vendor/fog-perf_defconfig
        make -j$(nproc) O=out ARCH=arm64 \
          LLVM=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          CLANG_TRIPLE=aarch64-linux-gnu-

    # 5. Package dengan AnyKernel3
    - name: Package kernel with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Nekonyatsu-Kernel.zip *

    # 6. Upload Artifact
    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: Nekonyatsu-Kernel
        path: Nekonyatsu-Kernel.zip
