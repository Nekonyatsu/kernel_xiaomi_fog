name: Nekonyatsu-ネコポイ

on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main
  workflow_dispatch:  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone source
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang curl git wget zip python3

    - name: Set up compiler
      run: |
        git clone --depth=1 https://github.com/ZyCromerZ/clang.git -b 17 ~/clang

    - name: Build kernel
      run: |
        export PATH=~/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out ARCH=arm64 vendor/fog-perf_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang

    - name: Upload zImage
      uses: actions/upload-artifact@v2
      with:
        name: zImage
        path: out/arch/arm64/boot/Image.gz-dtb
