name: Build KernelSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y git wget curl build-essential bc libncurses-dev flex bison openssl libssl-dev \
                            ccache libelf-dev libudev-dev libpci-dev libiberty-dev python3 python3-pip zip

    - name: Clone Clang
      run: |
        mkdir clang && cd clang
        wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.2-20231016-release/Clang-17.0.2-20231016.tar.gz
        tar -xf Clang-17.0.2-20231016.tar.gz
        echo "CLANG_PATH=$(pwd)" >> $GITHUB_ENV

    - name: Inject KernelSU
      run: |
        git clone --depth=1 -b main https://github.com/KernelSU/KernelSU
        rm -rf KernelSU/.git
        mv KernelSU kernel/KernelSU
        echo -e "\nKERNELSU := true" >> Makefile

    - name: Make bengal_defconfig
      run: |
        export PATH=$CLANG_PATH/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out ARCH=arm64 bengal_defconfig

    - name: Build Kernel
      run: |
        export PATH=$CLANG_PATH/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make -j$(nproc) O=out \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          LLVM=1 \
          LLVM_IAS=1

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git

    - name: Copy Kernel to AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU_Fog_Bengal.zip *

    - name: Upload zip
      uses: actions/upload-artifact@v3
      with:
        name: KernelSU_Flashable_Zip
        path: KernelSU_Fog_Bengal.zip
