name: Nekonyatsu-ネコポイ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make gcc clang curl git wget zip python3 libelf-dev

    - name: Setup Neutron Clang
      run: |
        curl -LO https://gitlab.com/varunhardgamer/prebuilt-clang/-/archive/master/prebuilt-clang-master.tar.gz
        mkdir -p ~/clang
        tar -xzf prebuilt-clang-master.tar.gz -C ~/clang --strip-components=1

    - name: Build Kernel
      run: |
        set -e
        export PATH="$HOME/clang/bin:$PATH"
        export ARCH=arm64
        export KBUILD_BUILD_USER=Nekonyatsu
        export KBUILD_BUILD_HOST=GitHubActions

        make O=out ARCH=arm64 vendor/fog-perf_defconfig
        make -j$(nproc) O=out ARCH=arm64 \
          LLVM=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          V=1 2>&1 | tee build.log

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Nekonyatsu-Kernel.zip *

    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: Nekonyatsu-Kernel
        path: Nekonyatsu-Kernel.zip
